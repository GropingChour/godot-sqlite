name: 🍏 iOS Simulator Builds
on:
  push:
    branches: [ godot-3.x-build ]

# Global Settings
env:
  PROJECT_FOLDER: .
  TARGET_PATH: demo/addons/godot-sqlite/bin/ios/
  TARGET_NAME: libgdsqlite
  TARGET: release

jobs:
  ios-simulator-compilation:
    name: iOS Simulator Compilation
    runs-on: "macos-11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      # Use python 3.x release (works cross platform)
      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: '3.x'
          # Optional - x64 or x86 architecture, defaults to x64
          architecture: 'x64'

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '12.5.1'  # 指定支持x86_64的Xcode版本

      - name: Configuring Python packages
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons
          python --version
          scons --version

      - name: Compilation
        run: |
          mkdir -v -p ${{env.PROJECT_FOLDER}}/${{env.TARGET_PATH}}/x86_64
          cd ${{env.PROJECT_FOLDER}}
          cd godot-cpp
          scons platform=ios ios_arch=x86_64 bits=64 target=${{env.TARGET}} generate_bindings=yes -j4
          ls bin/
          cd ..
          scons platform=ios ios_arch=x86_64 target=${{env.TARGET}} target_path=${{env.TARGET_PATH}} target_name=${{env.TARGET_NAME}}
          cp godot-cpp/bin/libgodot-cpp.ios.release.x86_64.a ${{env.TARGET_PATH}}/x86_64/libgodot-cpp.ios.release.x86_64.a

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ${{env.PROJECT_FOLDER}}/${{env.TARGET_PATH}}/x86_64
